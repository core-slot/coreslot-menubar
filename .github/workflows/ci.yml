name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # A push to main is never canceled by a later one; superseded pull request runs are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode 26 or later
        run: |
          xcodebuild -version
          swift --version
          major=$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::Xcode 26 or later is required, found ${major:-none}"
            exit 1
          fi

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test
